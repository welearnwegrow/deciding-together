<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>25 ways to decide together</title>
<!-- Print layout for the downloadable PDF. Build: serve the repo, open this page in headless Chrome, print to A4. -->
<link rel="stylesheet" href="../site.css">
<style>
@font-face{font-family:"DM Sans"; src:url(_fonts/dm-sans-latin-400-normal.woff2) format("woff2"); font-weight:400}
@font-face{font-family:"DM Sans"; src:url(_fonts/dm-sans-latin-500-normal.woff2) format("woff2"); font-weight:500}
@font-face{font-family:"DM Sans"; src:url(_fonts/dm-sans-latin-700-normal.woff2) format("woff2"); font-weight:700}
@font-face{font-family:"DM Serif Display"; src:url(_fonts/dm-serif-display-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Serif Display"; src:url(_fonts/dm-serif-display-latin-400-italic.woff2) format("woff2"); font-style:italic}
@page{size:A4; margin:0}
:root{--paper:#ffffff; --line:#857E70; --ink-mute:#5E584D; --ink-soft:#3E3A34}
html,body{margin:0; padding:0; background:#fff}
body{font-family:"DM Sans",sans-serif; color:#2E2A25; -webkit-print-color-adjust:exact; print-color-adjust:exact}
header.top, footer, body > *:not(#out):not(script){display:none !important}
.page{width:210mm; height:297mm; box-sizing:border-box; padding:16mm 15mm 14mm; position:relative; overflow:hidden; break-after:page; background:#fff; display:flex; flex-direction:column}
.page:last-child{break-after:auto}
.serif{font-family:"DM Serif Display",Georgia,serif; font-weight:400}
.kick{font-size:8.5pt; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:#7A5C22}
.cover h1{font-family:"DM Serif Display",Georgia,serif; font-weight:400; font-size:64pt; line-height:.98; margin:10mm 0 6mm}
.cover h1 em{color:#9C6A16}
.cover .sub{font-size:13pt; line-height:1.45; color:#55514A; max-width:150mm; margin:0 0 6mm}
.cover .intro{font-size:10.5pt; line-height:1.55; color:#3E3A34; max-width:160mm}
.cover .intro p{margin:0 0 3mm}
.mosaic{display:grid; grid-template-columns:repeat(4,1fr); gap:3mm; margin:7mm 0 8mm}
.mosaic canvas{width:100%; height:auto; aspect-ratio:460/288; background:#F7F5EF; border:1px solid #E2DDD0; border-radius:2.5mm; display:block}
.toc{margin-top:auto; border-top:2px solid #2E2A25; display:grid; grid-template-columns:repeat(4,1fr)}
.toc div{padding:4mm 4mm 0 0}
.toc b{font-family:"DM Serif Display",Georgia,serif; font-weight:400; font-size:24pt; color:#B07A1E; display:block; line-height:1}
.toc span{font-family:"DM Serif Display",Georgia,serif; font-size:12.5pt; display:block; margin:1mm 0}
.toc small{font-size:8.5pt; color:#6A665E; display:block; line-height:1.35}
.toc i{font-style:normal; font-size:8pt; color:#7A5C22; display:block; margin-top:2mm}
.toc ul{list-style:none; margin:3mm 0 0; padding:0}
.toc li{font-size:9pt; line-height:1.3; padding:1.2mm 0; border-top:1px solid #D6D1C3}
.mark{width:20mm; height:20mm; margin:-4mm -3mm 0 0}
.coverhead{display:flex; justify-content:space-between; align-items:flex-start}
.foot{margin-top:auto; padding-top:4mm; display:flex; justify-content:space-between; align-items:center; font-size:8pt; color:#6A665E; border-top:1px solid #D6D1C3}
.foot b{color:#8B4526; font-weight:700}
.cover .foot{margin-top:6mm}
.gh{display:flex; align-items:baseline; gap:4mm; margin:0 0 1mm}
.gh .n{font-family:"DM Serif Display",Georgia,serif; font-size:40pt; color:#B07A1E; line-height:1}
.gh h2{font-family:"DM Serif Display",Georgia,serif; font-weight:400; font-size:28pt; margin:0; line-height:1.05}
.gsub{font-size:12pt; font-weight:700; margin:1mm 0 2.5mm}
.gtext{font-size:9.5pt; line-height:1.5; color:#3E3A34; margin:0 0 5mm}
.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:4mm 4mm}
.card{display:flex; flex-direction:column; gap:1.5mm; break-inside:avoid}
.card canvas{width:100%; height:auto; aspect-ratio:460/288; background:#fff; border:1px solid #DDD7C9; border-radius:3mm; display:block}
.card b{font-size:10pt; line-height:1.25; font-weight:700}
.card span{font-size:8.6pt; line-height:1.4; color:#55514A}
.end{margin-top:6mm; background:#8B4526; color:#F3E9DC; border-radius:4mm; padding:6mm 7mm; display:grid; grid-template-columns:1fr auto; gap:3mm 8mm; align-items:center}
.end p{margin:0; font-size:10pt; line-height:1.5}
.end b{font-family:"DM Serif Display",Georgia,serif; font-weight:400; font-size:17pt; color:#fff; display:block; margin-bottom:1.5mm}
.end .url{font-weight:700; font-size:11pt; color:#fff; white-space:nowrap}
.allh{font-family:"DM Serif Display",Georgia,serif; font-weight:400; font-size:34pt; line-height:1.05; margin:2mm 0 6mm}
.grid25{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5mm 3.5mm; flex:1; align-content:space-evenly}
.c25{display:flex; flex-direction:column; gap:1.5mm}
.c25 canvas{width:100%; height:auto; aspect-ratio:460/288; background:#fff; border:1px solid #DDD7C9; border-radius:2.5mm; display:block}
.g25{display:block; height:4.6mm; font-style:normal; font-size:8pt; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#7A5C22; white-space:nowrap; overflow:visible; border-left:2px solid transparent}
.c25{--gc:#7A5C22}
.c25.g0{--gc:#B07A1E}
.c25.g1{--gc:#4F7485}
.c25.g2{--gc:#8B4526}
.c25.g3{--gc:#4E7A55}
.c25 .g25{color:var(--gc); border-bottom:1.5px solid var(--gc); margin:0 -3.5mm 1.2mm 0}
.c25:nth-child(5n) .g25{margin-right:0}
.c25 span{font-size:8.8pt; line-height:1.25; font-weight:500}
.allurl{display:flex; justify-content:center; padding:4mm 0 2mm}
.allurl span{background:#8B4526; color:#fff; font-weight:700; font-size:13pt; border-radius:999px; padding:3.5mm 9mm}
</style>
</head>
<body>
<div id="out"></div>
<script src="../data.js"></script>
<script src="../entries.js"></script>
<script src="../edits.js"></script>
<script src="../site.js"></script>
<script src="../scenes.js"></script>
<script>
(async () => {
  await loadEdits(); readColors(); chrome();
  /* print: thicker connecting lines, so they survive being shrunk onto paper */
  { const base = line; line = (g, x1, y1, x2, y2, col, w, dash) => base(g, x1, y1, x2, y2, col, (w || 1) * 2, dash); }
  const mk = document.querySelector("header.top .bmark"); const MARK = mk ? mk.outerHTML.replace('class="bmark"', 'class="mark"') : ""; document.querySelectorAll("header.top, footer").forEach(x => x.remove());
  const T = (k, d) => (window.FG_EDITS && FG_EDITS[k] && FG_EDITS[k].v) || d;
  const FAMS = FG.families.filter(f => f.id !== "8");
  const inFam = f => FG.structures.filter(s => S[s.id] && (FG.familyOf ? FG.familyOf[s.id] : s.family) === f.id && !(FG.asExample || {})[s.id])
    .sort((a,b) => (FG.order.indexOf(a.id) + 999*(FG.order.indexOf(a.id) < 0)) - (FG.order.indexOf(b.id) + 999*(FG.order.indexOf(b.id) < 0)));
  const total = FAMS.reduce((n, f) => n + inFam(f).length, 0);
  const URL_ = "welearnwegrow.github.io/deciding-together";
  const foot = n => `<div class="foot"><span>Deciding Together: A Field Guide · Education edition · We Learn, We Grow</span><span><b>${URL_}</b> · ${n}</span></div>`;
  const strip = h => { const d = document.createElement("div"); d.innerHTML = h; d.querySelectorAll(".assume").forEach(x => x.remove()); return d.innerHTML; };

  let html = "";
  FAMS.forEach((f, n) => {
    const last = n === FAMS.length - 1;
    html += `<section class="page">
      <div class="gh"><span class="n">${n+1}</span><h2>${esc(T(`fam:${f.id}:name`, f.name))}</h2></div>
      <p class="gsub">${esc(T(`fam:${f.id}:sub`, f.sub || ""))}</p>
      <p class="gtext">${T(`fam:${f.id}:text`, f.text)}</p>
      <div class="cards">${inFam(f).map(s => `<div class="card"><canvas width="460" height="288" data-thumb="${s.id}"></canvas><b>${esc(T(`str:${s.id}:name`, s.name))}</b><span>${esc(T(`str:${s.id}:card`, s.card || s.line))}</span></div>`).join("")}</div>
      ${last ? `<div class="end"><div><b>Open any of these online</b><p>Each structure in the guide has an example where it works and one where it backfires, and the social forces to watch for. If you have a decision in front of you now, describe it in Guide me and get a step-by-step way to decide.</p></div><span class="url">${URL_}</span></div>` : ""}
      ${foot(n+2)}
    </section>`;
  });
  const ALLS = FAMS.flatMap((f, n) => inFam(f).map((x, i) => Object.assign({}, x, {gi: n, grp: i === 0 ? `${n+1} · ${T(`fam:${f.id}:name`, f.name)}` : ""})));
  html = `<section class="page all">
    <div class="coverhead"><h2 class="allh">${ALLS.length} ways to decide together</h2><img class="mark" src="tree-mark.png" alt=""></div>
    <div class="grid25">${ALLS.map(s => `<div class="c25 g${s.gi}"><em class="g25">${esc(s.grp)}</em><canvas width="460" height="288" data-thumb="${s.id}"></canvas><span>${esc(T(`str:${s.id}:name`, s.name))}</span></div>`).join("")}</div>
    ${foot(1)}
  </section>` + html;
  document.getElementById("out").innerHTML = html;
  document.querySelectorAll("canvas[data-thumb]").forEach(c => { try { drawStill(c, c.dataset.thumb); } catch (e){ console.warn(c.dataset.thumb, e); } });
  await document.fonts.ready;
  window.PDF_READY = {total, fams: FAMS.map(f => inFam(f).length)};
})();
</script>
</body>
</html>
